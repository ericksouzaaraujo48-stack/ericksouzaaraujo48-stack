<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { fill:#e6edf3 } .m { fill:#8b949e } .y { fill:#F2C811 }
    .card { fill:#161b22; stroke:#30363d }
    @keyframes grow { from { transform:scaleX(0) } to { transform:scaleX(1) } }
    @keyframes fade { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
    @keyframes pulse { 0%,100% { r:6; opacity:1 } 50% { r:9; opacity:.4 } }
    .bar { transform-box:fill-box; transform-origin:left center; animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both }
    .f { animation:fade .8s ease-out both }
    .pulse { animation:pulse 1.8s ease-in-out infinite }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2C811"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="438" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- Header -->
  <g class="f">
    <rect x="25" y="22" width="8" height="26" rx="2" fill="#F2C811"/>
    <rect x="36" y="30" width="8" height="18" rx="2" fill="#ff8a00"/>
    <rect x="47" y="38" width="8" height="10" rx="2" fill="#e8590c"/>
    <text x="68" y="42" class="t" font-size="20" font-weight="700">Erick Araujo · Dashboard de Carreira</text>
    <text x="875" y="42" class="m" font-size="12" text-anchor="end">Dados &amp; BI · 2026</text>
  </g>

  <!-- KPI cards -->
  <g class="f" style="animation-delay:.15s">
    <rect class="card" x="25" y="65" width="205" height="95" rx="10"/>
    <text x="42" y="92" class="m" font-size="12">PERÍODO — CIÊNCIA DA COMPUTAÇÃO</text>
    <text x="42" y="132" class="y" font-size="38" font-weight="800">4º</text>
    <text x="95" y="132" class="m" font-size="12">UNA Barreiro</text>
  </g>
  <g class="f" style="animation-delay:.3s">
    <rect class="card" x="240" y="65" width="205" height="95" rx="10"/>
    <text x="257" y="92" class="m" font-size="12">PROMOÇÃO NA PHARMASCIENCE</text>
    <text x="257" y="132" class="y" font-size="30" font-weight="800">Aux → Assist.</text>
  </g>
  <g class="f" style="animation-delay:.45s">
    <rect class="card" x="455" y="65" width="205" height="95" rx="10"/>
    <text x="472" y="92" class="m" font-size="12">HORAS DE CURSOS</text>
    <text x="472" y="132" class="y" font-size="38" font-weight="800">320h</text>
    <text x="560" y="132" class="m" font-size="12">Prog. + Modelagem</text>
  </g>
  <g class="f" style="animation-delay:.6s">
    <rect class="card" x="670" y="65" width="205" height="95" rx="10"/>
    <text x="687" y="92" class="m" font-size="12">STACK PRINCIPAL</text>
    <text x="687" y="132" class="y" font-size="38" font-weight="800">7</text>
    <text x="715" y="132" class="m" font-size="12">tecnologias</text>
  </g>

  <!-- Bar chart panel -->
  <rect class="card" x="25" y="175" width="520" height="245" rx="10"/>
  <text x="45" y="203" class="t" font-size="14" font-weight="600">Stack técnica — nível de domínio (%)</text>

  <g font-size="13">
    <text x="45" y="238" class="t">Excel Avançado</text>
    <rect x="165" y="226" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="226" width="279" height="14" rx="7" fill="url(#g)" style="animation-delay:.3s"/>
    <text x="490" y="238" class="m" font-size="12">90</text>

    <text x="45" y="266" class="t">Power BI</text>
    <rect x="165" y="254" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="254" width="264" height="14" rx="7" fill="url(#g)" style="animation-delay:.4s"/>
    <text x="490" y="266" class="m" font-size="12">85</text>

    <text x="45" y="294" class="t">SQL</text>
    <rect x="165" y="282" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="282" width="217" height="14" rx="7" fill="url(#b)" style="animation-delay:.5s"/>
    <text x="490" y="294" class="m" font-size="12">70</text>

    <text x="45" y="322" class="t">Git / GitHub</text>
    <rect x="165" y="310" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="310" width="217" height="14" rx="7" fill="url(#b)" style="animation-delay:.6s"/>
    <text x="490" y="322" class="m" font-size="12">70</text>

    <text x="45" y="350" class="t">Java</text>
    <rect x="165" y="338" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="338" width="202" height="14" rx="7" fill="url(#b)" style="animation-delay:.7s"/>
    <text x="490" y="350" class="m" font-size="12">65</text>

    <text x="45" y="378" class="t">JavaScript</text>
    <rect x="165" y="366" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="366" width="186" height="14" rx="7" fill="url(#b)" style="animation-delay:.8s"/>
    <text x="490" y="378" class="m" font-size="12">60</text>

    <text x="45" y="406" class="t">Python <tspan class="m" font-size="11">(aprendendo)</tspan></text>
    <rect x="165" y="394" width="310" height="14" rx="7" fill="#21262d"/>
    <rect class="bar" x="165" y="394" width="124" height="14" rx="7" fill="#3fb950" style="animation-delay:.9s"/>
    <text x="490" y="406" class="m" font-size="12">40</text>
  </g>

  <!-- Timeline panel -->
  <rect class="card" x="560" y="175" width="315" height="245" rx="10"/>
  <text x="580" y="203" class="t" font-size="14" font-weight="600">Linha do tempo</text>
  <line x1="590" y1="235" x2="590" y2="375" stroke="#30363d" stroke-width="2"/>

  <g class="f" style="animation-delay:.8s">
    <circle cx="590" cy="235" r="6" fill="#58a6ff"/>
    <text x="608" y="231" class="t" font-size="13" font-weight="600">Jan/2026</text>
    <text x="608" y="249" class="m" font-size="12">Auxiliar de Auditoria · PharmaScience</text>
  </g>
  <g class="f" style="animation-delay:1.1s">
    <circle cx="590" cy="302" r="6" fill="#F2C811"/>
    <text x="608" y="298" class="t" font-size="13" font-weight="600">Out/2026</text>
    <text x="608" y="316" class="m" font-size="12">Promovido a Assistente de Auditoria</text>
  </g>
  <g class="f" style="animation-delay:1.4s">
    <circle class="pulse" cx="590" cy="369" r="6" fill="#3fb950"/>
    <text x="608" y="365" class="t" font-size="13" font-weight="600">Hoje</text>
    <text x="608" y="383" class="m" font-size="12">Construindo carreira em Dados &amp; BI</text>
  </g>
</svg>
